<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Pick3 Playtest</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#5b914e;font-family:monospace;color:#fff}button{font:inherit;font-weight:bold;color:#fff;border:3px solid #17130e;border-radius:5px;padding:11px;background:#438ed8;box-shadow:0 4px #17130e}button:disabled{opacity:.4}.w{max-width:900px;margin:auto;padding:8px}.p{background:#604b2f;border:4px solid #21190f;box-shadow:inset 0 0 0 3px #96784e;padding:9px;margin-bottom:8px}.top{display:grid;grid-template-columns:1fr 1fr;gap:8px}.target{text-align:center;background:#282117;padding:7px}.target b{font-size:30px;color:#ffd15c}.score{display:flex;align-items:center;justify-content:center;gap:6px;margin:8px}.n{font-size:28px;font-weight:bold;padding:5px 10px;border:3px solid #18130d;min-width:60px;text-align:center}.base{background:#eee;color:#111}.bonus{background:#914cc5}.total{font-size:34px;color:#79ef6d}.bounce{animation:b .4s}.stats{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}.stat{background:#2c241a;padding:6px;border:2px solid #17130e}.totems{display:flex;gap:5px;justify-content:center}.totem{background:#4a3563;border:3px solid #17130e;padding:8px;min-width:80px;text-align:center}.msg{text-align:center;min-height:46px;padding:10px;font-weight:bold;font-size:16px;color:#fff1b7}.board{min-height:170px;display:flex;align-items:center;justify-content:center;gap:9px;flex-wrap:wrap}.card{width:105px;height:132px;background:#ddcca5;color:#241a0e;border:4px solid #21180e;box-shadow:inset 0 0 0 3px #f4e8c9,5px 5px #21180e88;padding:7px;position:relative;text-align:center}.card.sel{transform:translateY(-9px);outline:5px solid #fff36a}.card.pair{animation:f .55s 2}.ico{font-size:29px}.name{font-weight:bold;margin-top:7px}.type{font-size:10px}.val{position:absolute;right:6px;bottom:4px;font-size:18px;font-weight:bold}.new{position:absolute;right:3px;top:3px;background:#3989df;color:white;font-size:8px;padding:2px}.actions{display:flex;gap:7px;justify-content:center;flex-wrap:wrap}.submit{background:#914cc5}.discard{background:#735a3c}.merchant{background:#e09632}.row{display:flex;gap:8px;margin-top:8px}.pile{flex:1;text-align:center;background:#34291c;border:3px solid #17130e;padding:7px}.modal{display:none;position:fixed;inset:0;background:#000c;z-index:9;padding:12px;overflow:auto}.modal.on{display:flex;align-items:center;justify-content:center}.box{width:min(680px,100%);background:#604b2f;border:5px solid #17130e;padding:12px}.offers{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.offer{background:#e2d0a4;color:#21180e;border:4px solid #17130e;padding:8px;text-align:center;opacity:0;transform:scale(.3)}.offer.show{animation:r .55s forwards}.offer button{background:#4e9c4c}.reroll{background:#914cc5}.close{background:#555}@keyframes b{50%{transform:scale(1.35)}}@keyframes f{50%{outline:6px solid #ffd84f;transform:scale(1.08)}}@keyframes r{to{opacity:1;transform:none}}@media(max-width:600px){.top{grid-template-columns:1fr}.card{width:92px;height:120px}.offers{grid-template-columns:1fr}.n{font-size:23px}.total{font-size:29px}}
</style></head><body><div class="w">
<div class="top"><div class="p"><div class="target">ROUND <span id="round">1</span><br>Target <b id="target">9</b></div><div class="score"><span id="base" class="n base">0</span>+<span id="bonus" class="n bonus">0</span>=<span id="total" class="total">0</span></div><div class="stats"><span class="stat">Draws <b id="draws">2</b></span><span class="stat">Points <b id="points">0</b></span><span class="stat">Deck <b id="deckn">6</b></span></div></div><div class="p"><b>TOTEMS</b><div id="totems" class="totems"></div></div></div>
<div class="p"><div id="msg" class="msg">Press DRAW to begin.</div><div id="board" class="board"></div><div class="actions"><button id="draw">DRAW 3</button><button id="submit" class="submit" disabled>SUBMIT BONUS</button><button id="disc" class="discard">DISCARD (<span id="discn">0</span>)</button><button id="deckbtn" class="merchant">DECK MANAGER</button></div><div class="row"><div class="pile">Draw pile<br><b id="pilen">6</b></div><div class="pile">Selected<br><b id="preview">—</b></div></div></div></div>
<div id="dm" class="modal"><div class="box"><h2>Discard Pile</h2><div id="dl" class="board"></div><button class="close" onclick="dm.classList.remove('on')">CLOSE</button></div></div>
<div id="deckm" class="modal"><div class="box"><h2>DECK MANAGER</h2><p>Choose the exact cards in your unlocked slots. The deck is shuffled at the start of each round.</p><div id="deckedit"></div><button class="close" onclick="deckm.classList.remove('on')">DONE</button></div></div>
<div id="shop" class="modal"><div class="box"><h2>MERCHANT</h2><div id="summary"></div><div id="spin" class="msg">SPINNING...</div><div id="offers" class="offers"></div><div class="actions" style="margin-top:10px"><button id="reroll" class="reroll">REROLL — 1 POINT</button><button id="next" class="close">NEXT ROUND</button></div></div></div>
<script>
const I={plank:['Plank','Craft','🔧',1],stick:['Stick','Craft','🔧',1],iron:['Iron','Ore','◆',3],gold:['Gold','Ore','◆',4],bone:['Bone','Loot','🦴',1],leather:['Leather','Loot','🦴',2],bread:['Bread','Food','🍴',2],meat:['Meat','Food','🍴',3]};
const U=[['Builder Totem','Pairs +1','pair',4],['Collector Totem','Different Items +2','items',5],['Explorer Totem','Different Types +3','types',6],['Extra Draw','+1 Draw each round','draw',5],['Open Slot','Add random card to deck','slot',3],['Rich Ore','Ore cards +1 base','ore',4]];
let S={round:1,target:9,base:0,bonus:0,points:0,draws:2,deck:['plank','plank','iron','gold','bone','leather'],pile:[],board:[],discard:[],sel:new Set(),totems:[],drawMod:0,ore:0,active:true,itemHits:0,typeHits:0,rerolls:0,busy:false};
const $=x=>document.getElementById(x),wait=n=>new Promise(r=>setTimeout(r,n)),sh=a=>[...a].sort(()=>Math.random()-.5),uid=()=>Math.random().toString(36).slice(2);
function v(c){return I[c.id][3]+(I[c.id][1]=='Ore'?S.ore:0)}function tb(x){return S.totems.filter(t=>t==x).length}
function group(){let c=S.board.filter(x=>S.sel.has(x.u));if(c.length<3)return null;let ni=new Set(c.map(x=>x.id)).size,nt=new Set(c.map(x=>I[x.id][1])).size;if(nt==c.length)return['DIFFERENT TYPES',6+3*tb('types'),'types'];if(ni==c.length)return['DIFFERENT ITEMS',3+2*tb('items'),'items'];return null}
function render(){round.textContent=S.round;target.textContent=S.target;base.textContent=S.base;bonus.textContent=S.bonus;total.textContent=S.base+S.bonus;draws.textContent=S.draws;points.textContent=S.points;deckn.textContent=S.deck.length;pilen.textContent=S.pile.length;discn.textContent=S.discard.length;board.innerHTML='';S.board.forEach(c=>{let x=I[c.id],d=document.createElement('div');d.className='card'+(S.sel.has(c.u)?' sel':'');d.dataset.u=c.u;d.innerHTML=`${c.fresh?'<i class="new">NEW</i>':''}<div class=ico>${x[2]}</div><div class=name>${x[0]}</div><div class=type>${x[1]}</div><div class=val>${v(c)}N</div>`;d.onclick=()=>{if(S.busy)return;S.sel.has(c.u)?S.sel.delete(c.u):S.sel.add(c.u);render()};board.appendChild(d)});let g=group();preview.textContent=g?g[0]+' +'+g[1]:'—';submit.disabled=S.busy||!g;draw.disabled=S.busy||S.draws<=0||S.pile.length==0;totems.innerHTML='';for(let i=0;i<3;i++){let d=document.createElement('div');d.className='totem';d.textContent=S.totems[i]||'EMPTY';totems.appendChild(d)}}
function bump(id){let e=$(id);e.classList.remove('bounce');void e.offsetWidth;e.classList.add('bounce')}async function add(k,n,m){msg.textContent=m;await wait(650);S[k]+=n;bump(k);bump('total');render();await wait(500)}
async function doDraw(){if(S.busy)return;S.busy=true;S.draws--;S.board.forEach(c=>c.fresh=false);S.sel.clear();render();let fresh=[];for(let z=0;z<3&&S.pile.length;z++){let c={id:S.pile.shift(),u:uid(),fresh:true};S.board.push(c);fresh.push(c);render();msg.textContent='Drew '+I[c.id][0];await wait(450)}await add('base',fresh.reduce((a,c)=>a+v(c),0),'NEW CARDS → BASE NUGGETS');let by={};S.board.forEach(c=>(by[c.id]??=[]).push(c));for(let a of Object.values(by)){for(let p=0;p<Math.floor(a.length/2);p++){let pair=a.slice(p*2,p*2+2);pair.forEach(c=>{let e=document.querySelector(`[data-u="${c.u}"]`);if(e)e.classList.add('pair')});await wait(700);await add('bonus',1+tb('pair'),'PAIR! → BONUS');}}S.busy=false;msg.textContent='Select a bonus group, submit it, or draw again.';render();endCheck()}
async function doSubmit(){let g=group();if(!g)return;S.busy=true;await add('bonus',g[1],g[0]+'! → +'+g[1]);if(g[2]=='items')S.itemHits++;if(g[2]=='types')S.typeHits++;let ids=new Set(S.sel);for(let c of S.board.filter(x=>ids.has(x.u))){S.discard.push(c);S.board=S.board.filter(x=>x.u!=c.u);render();await wait(190)}S.sel.clear();S.busy=false;msg.textContent='Scored cards discarded. Score again or DRAW 3.';render();endCheck()}
function endCheck(){
 if(!S.active)return;
 if(S.base+S.bonus>=S.target){
   msg.textContent='TARGET CLEARED! Finish scoring this board, then COMPLETE ROUND.';
   draw.textContent='COMPLETE ROUND';
   draw.disabled=S.busy;
   draw.onclick=completeRound;
 } else if(S.draws<=0&&S.pile.length==0) msg.textContent='NO DRAWS LEFT — ROUND FAILED';
}
function completeRound(){
 if(S.busy||S.base+S.bonus<S.target)return;
 S.active=false;
 let e=3+S.draws+S.itemHits+(2*S.typeHits);
 S.points+=e; S.earned=e;
 msg.textContent='ROUND COMPLETE! +'+e+' POINTS';
 render();
 setTimeout(openShop,900);
}
async function reveal(){offers.innerHTML='';let opts=sh(U).slice(0,3);opts.forEach(o=>{let d=document.createElement('div');d.className='offer';d.innerHTML=`<h3>${o[0]}</h3><p>${o[1]}</p><b>${o[3]} Points</b><br><button>BUY</button>`;d.querySelector('button').onclick=()=>buy(o,d);offers.appendChild(d)});for(let i=0;i<3;i++){spin.textContent='SPINNING...';await wait(650);offers.children[i].classList.add('show');spin.textContent='NEW UPGRADE!';await wait(700)}spin.textContent='Buy or reroll.'}
function shopSummary(){summary.innerHTML=`<div style="font-size:24px;color:#ffd85b;margin-bottom:8px">POINTS OWNED: <b>${S.points}</b></div>Round reward: 3 base + ${S.draws} unused Draw + ${S.itemHits} Different Item + ${2*S.typeHits} Different Type = <b>${S.earned||0} Points</b>`}
function openShop(){shop.classList.add('on');shopSummary();reveal()}
function buy(o,d){if(S.points<o[3])return alert('Not enough Points');if(['pair','items','types'].includes(o[2])&&S.totems.length>=3)return alert('Totem slots full for this prototype');S.points-=o[3];if(['pair','items','types'].includes(o[2]))S.totems.push(o[2]);if(o[2]=='draw')S.drawMod++;if(o[2]=='ore')S.ore++;if(o[2]=='slot')S.deck.push(sh(Object.keys(I))[0]);d.style.opacity=.35;d.querySelector('button').disabled=true;render();shopSummary()}
function nextRound(){shop.classList.remove('on');S.round++;S.target=[9,14,20,28,38][S.round-1]||Math.ceil(S.target*1.4);S.base=S.bonus=0;S.draws=2+S.drawMod;S.pile=sh(S.deck);S.board=[];S.discard=[];S.sel.clear();S.active=true;S.itemHits=0;S.typeHits=0;S.rerolls=0;reroll.textContent='REROLL — 1 POINT';draw.textContent='DRAW 3';draw.onclick=doDraw;msg.textContent='Next round ready.';render()}
function openDeckManager(){
 if(S.active&&(S.base>0||S.bonus>0||S.board.length)){alert('Finish the current round before editing your deck.');return}
 deckedit.innerHTML='';
 S.deck.forEach((id,idx)=>{
   let row=document.createElement('div');
   row.style='display:flex;gap:8px;align-items:center;margin:6px 0;background:#34291c;padding:7px';
   let label=document.createElement('b'); label.textContent='Slot '+(idx+1); row.appendChild(label);
   let sel=document.createElement('select'); sel.style='flex:1;padding:8px;font:inherit';
   Object.keys(I).forEach(k=>{let o=document.createElement('option');o.value=k;o.textContent=I[k][0]+' — '+I[k][1]+' — '+I[k][3]+'N';if(k===id)o.selected=true;sel.appendChild(o)});
   sel.onchange=()=>{S.deck[idx]=sel.value;S.pile=sh(S.deck);render()};
   row.appendChild(sel); deckedit.appendChild(row);
 });
 deckm.classList.add('on');
}
deckbtn.onclick=openDeckManager;
draw.onclick=doDraw;submit.onclick=doSubmit;disc.onclick=()=>{dl.innerHTML=S.discard.map(c=>`<div class=card><div class=ico>${I[c.id][2]}</div><div class=name>${I[c.id][0]}</div></div>`).join('');dm.classList.add('on')};reroll.onclick=async()=>{let c=S.rerolls+1;if(S.points<c)return alert('Not enough Points');S.points-=c;S.rerolls++;reroll.textContent=`REROLL — ${S.rerolls+1} POINTS`;render();shopSummary();await reveal()};next.onclick=nextRound;S.pile=sh(S.deck);render();
</script></body></html>
